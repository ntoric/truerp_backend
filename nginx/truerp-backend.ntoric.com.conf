# TruERP backend — HTTP reverse proxy
# Domain: truerp-backend.ntoric.com
# Public port: 7077 → upstream API (Docker) on 127.0.0.1:8088
#
# Install (Ubuntu/Debian):
#   sudo cp nginx/truerp-backend.ntoric.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/truerp-backend.ntoric.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream truerp_api {
    server 127.0.0.1:7077;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name truerp-backend.ntoric.com;

    client_max_body_size 50m;

    # Optional: tighten later; keep open while validating the proxy
    # allow 0.0.0.0/0;

    access_log /var/log/nginx/truerp-backend.access.log;
    error_log  /var/log/nginx/truerp-backend.error.log;

    location /health {
        proxy_pass http://truerp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://truerp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://truerp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
