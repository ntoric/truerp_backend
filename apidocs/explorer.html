<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TruERP Public API Explorer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body { margin: 0; }
    .notice { padding: 10px 20px; background: #fef3c7; color: #78350f; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .notice a { color: #4f46e5; }
  </style>
</head>
<body>
  <div class="notice">
    Requests made here run against <strong>live store data</strong>. Use a test store's API key.
    Click <strong>Authorize</strong> and paste the key (without "Bearer").
    <a href="__BASE_URL__/api/public/docs">Back to the reference</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "__BASE_URL__/api/public/v1/openapi.json",
      dom_id: "#swagger-ui",
      deepLinking: true,
      persistAuthorization: false,
      displayRequestDuration: true,
      tryItOutEnabled: false,
      docExpansion: "list",
      defaultModelsExpandDepth: 0
    });
  </script>
</body>
</html>
